name: monthly
on:
  schedule:
    - cron: "15 13 1 * *"  # 1st of the month, ~9 AM New York
  workflow_dispatch:
concurrency:
  group: workers
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: cfg  # skip quietly until secrets are added (README step 6)
        run: if [ -n "$DATABASE_URL" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "::notice::DATABASE_URL secret not set; skipping"; fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - if: steps.cfg.outputs.ok == 'true'
        uses: actions/checkout@v4
      - if: steps.cfg.outputs.ok == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.cfg.outputs.ok == 'true'
        run: pip install -r requirements.txt
      - if: steps.cfg.outputs.ok == 'true'
        run: alembic upgrade head
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - if: steps.cfg.outputs.ok == 'true'
        run: python -m workers.run_monthly
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
          GMAIL_TOKENS_JSON: ${{ secrets.GMAIL_TOKENS_JSON }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          ALLOWED_EMAIL: ${{ secrets.ALLOWED_EMAIL }}
          APP_URL: ${{ secrets.APP_URL }}
